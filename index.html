<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nose Bird</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
       background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;padding:12px}
  h1{margin:0;font-size:1.4rem}
  #wrap{position:relative;width:100%;max-width:900px}
  canvas{width:100%;display:block;border-radius:16px;box-shadow:0 10px 40px #0008;touch-action:none}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
      background:#0f172a99;border-radius:16px;text-align:center;padding:16px}
  .ov h2{margin:0;font-size:2.2rem;color:#fff;text-shadow:0 3px 0 #0006}
  .ov p{margin:0;color:#cbd5e1}
  button{font:600 1rem system-ui;padding:12px 24px;border:0;border-radius:12px;background:#f59e0b;color:#1c1917;
         cursor:pointer;box-shadow:0 4px 0 #b45309}
  button.alt{background:#38bdf8;box-shadow:0 4px 0 #0369a1}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #b45309}
  [hidden]{display:none!important}
  #msg{font-size:.85rem;color:#94a3b8;min-height:1.2em;margin:0}
</style>
</head>
<body>
<h1>🐦 Nose Bird</h1>
<div id="wrap">
  <canvas id="c" width="720" height="480"></canvas>
  <div class="ov" id="menu">
    <h2>Nose Bird</h2>
    <p>Gerakkan hidungmu naik-turun untuk terbang lewat celah pipa.</p>
    <button id="bCam">📷 Main dengan Kamera</button>
    <button id="bMouse" class="alt">🖱️ Main dengan Mouse / Sentuh</button>
  </div>
  <div class="ov" id="over" hidden>
    <h2>Game Over</h2>
    <p id="res"></p>
    <button id="bAgain">🔄 Main Lagi (Spasi)</button>
  </div>
</div>
<p id="msg"></p>
<video id="v" playsinline muted hidden></video>

<script type="module">
import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d"), video = $("v");
const W = 720, H = 480, GROUND = 56, PW = 72, GAP = 150, BR = 16, BX = 170, SPACING = 290, CAP = 28;
const rand = (a, b) => Math.random() * (b - a) + a;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PLAY_MIN = BR, PLAY_MAX = H - GROUND - BR;

let mode = "menu", landmarker = null, useCam = false, lastVT = -1, last = performance.now();
let targetY = H / 2, scroll = 0, shake = 0, pulse = 0, noseN = null, best = 0;
try { best = +localStorage.getItem("nosebird-best") || 0; } catch (e) {}
let bird, pipes, parts, score;
const clouds = Array.from({ length: 7 }, () => ({ x: rand(0, W), y: rand(20, 200), s: rand(.6, 1.4), sp: rand(.1, .3) }));

function reset() {
  bird = { y: H / 2, vy: 0, flap: 0 };
  pipes = [700, 700 + SPACING, 700 + 2 * SPACING].map(x => ({ x, top: rand(70, H - GROUND - GAP - 70), passed: false }));
  parts = []; score = 0; shake = 0; targetY = H / 2;
}
reset();

/* ---------- input ---------- */
cv.addEventListener("pointermove", e => {
  if (useCam) return;
  const r = cv.getBoundingClientRect();
  targetY = clamp((e.clientY - r.top) / r.height * H, PLAY_MIN, PLAY_MAX);
});
addEventListener("keydown", e => { if ((e.code === "Space" || e.code === "Enter") && mode === "over") restart(); });

function start() { reset(); mode = "play"; $("menu").hidden = true; $("over").hidden = true; }
function restart() { start(); }
$("bAgain").onclick = restart;
$("bMouse").onclick = () => { useCam = false; $("msg").textContent = "Mode mouse: gerakkan kursor / jari naik-turun."; start(); };
$("bCam").onclick = async () => {
  $("msg").textContent = "Memuat model & kamera…";
  try {
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await PoseLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: MODEL, delegate: "GPU" }, runningMode: "VIDEO", numPoses: 1 });
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    await video.play();
    useCam = true; $("msg").textContent = "Kamera aktif. Berdirilah agar kepala terlihat jelas."; start();
  } catch (e) {
    $("msg").textContent = "Kamera gagal (" + e.message + "). Gunakan mode mouse.";
  }
};

function readPose() {
  if (!useCam || !landmarker || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  try {
    const r = landmarker.detectForVideo(video, performance.now());
    if (r.landmarks && r.landmarks.length) {
      noseN = r.landmarks[0][0];
      targetY = PLAY_MIN + clamp((noseN.y - 0.15) / 0.7, 0, 1) * (PLAY_MAX - PLAY_MIN);
    }
  } catch (e) {}
}

/* ---------- game logic ---------- */
function burst(x, y) {
  for (let i = 0; i < 36; i++) {
    const a = rand(0, 6.283), s = rand(2, 8);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, r: rand(2, 6),
                 c: ["#fde047", "#fb923c", "#f87171", "#fff"][i % 4] });
  }
}

function update(dt) {
  const speed = mode === "play" ? Math.min(3.2 + score * 0.06, 6) : 1.2;
  scroll += speed * dt;
  clouds.forEach(c => { c.x -= c.sp * dt; if (c.x < -120) c.x = W + 60; });
  pulse = Math.max(0, pulse - 0.05 * dt);
  shake = Math.max(0, shake - 0.8 * dt);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.25 * dt; p.life -= 0.02 * dt; });
  parts = parts.filter(p => p.life > 0);
  bird.flap += 0.35 * dt;

  if (mode === "menu") { bird.y = H / 2 + Math.sin(performance.now() / 300) * 12; return; }
  if (mode === "over") { bird.y = Math.min(bird.y + 6 * dt, H - GROUND - BR); return; }

  const prev = bird.y;
  bird.y += (targetY - bird.y) * Math.min(1, 0.25 * dt);
  bird.y = clamp(bird.y, PLAY_MIN, PLAY_MAX);
  bird.vy = bird.y - prev;

  for (const p of pipes) {
    p.x -= speed * dt;
    if (p.x < -PW - 10) {
      p.x = Math.max(...pipes.map(q => q.x)) + SPACING;
      p.top = rand(70, H - GROUND - GAP - 70); p.passed = false;
    }
    if (BX + BR * .85 > p.x && BX - BR * .85 < p.x + PW &&
        (bird.y - BR * .85 < p.top || bird.y + BR * .85 > p.top + GAP)) gameOver();
    if (!p.passed && p.x + PW < BX) { p.passed = true; score++; pulse = 1; }
  }
}

function gameOver() {
  if (mode === "over") return;
  mode = "over"; shake = 16; burst(BX, bird.y);
  if (score > best) { best = score; try { localStorage.setItem("nosebird-best", best); } catch (e) {} }
  $("res").textContent = `Skor: ${score}  •  Terbaik: ${best}`;
  setTimeout(() => { $("over").hidden = false; }, 500);
}

/* ---------- drawing ---------- */
function drawSky() {
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#38bdf8"); g.addColorStop(.7, "#bae6fd"); g.addColorStop(1, "#fef9c3");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(560, 90, 5, 560, 90, 70);
  g.addColorStop(0, "#fff7aeee"); g.addColorStop(1, "#fff7ae00");
  ctx.fillStyle = g; ctx.fillRect(480, 10, 160, 160);
  ctx.fillStyle = "#fde047"; ctx.beginPath(); ctx.arc(560, 90, 26, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffffffcc";
  for (const c of clouds) {
    ctx.beginPath();
    for (const [dx, dy, r] of [[0, 0, 22], [24, -8, 28], [52, 0, 22], [26, 8, 24]]) ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 7);
    ctx.fill();
  }
  const hill = (off, base, amp, col, k) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) ctx.lineTo(x, base + Math.sin((x + scroll * k) / 70 + off) * amp + Math.sin((x + scroll * k) / 29) * amp * .3);
    ctx.lineTo(W, H); ctx.fill();
  };
  hill(0, H - GROUND - 70, 26, "#86efac", .15);
  hill(2, H - GROUND - 36, 20, "#4ade80", .35);
}

function drawPipe(x, top) {
  const bottomY = top + GAP, gh = H - GROUND;
  const g = ctx.createLinearGradient(x, 0, x + PW, 0);
  g.addColorStop(0, "#2f8f2f"); g.addColorStop(.3, "#7ee05a"); g.addColorStop(.6, "#4cb43a"); g.addColorStop(1, "#276f27");
  const part = (px, py, w, h) => {
    ctx.fillStyle = g; ctx.fillRect(px, py, w, h);
    ctx.strokeStyle = "#1b4d1b"; ctx.lineWidth = 3; ctx.strokeRect(px, py, w, h);
  };
  part(x + 5, -4, PW - 10, top - CAP + 4);
  part(x, top - CAP, PW, CAP);
  part(x, bottomY, PW, CAP);
  part(x + 5, bottomY + CAP, PW - 10, gh - bottomY - CAP + 4);
}

function drawGround() {
  ctx.fillStyle = "#d6a45a"; ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = "#65c23a"; ctx.fillRect(0, H - GROUND, W, 14);
  ctx.fillStyle = "#4ba02a";
  for (let x = -((scroll * 1) % 40); x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, H - GROUND); ctx.lineTo(x + 20, H - GROUND); ctx.lineTo(x + 8, H - GROUND + 14); ctx.lineTo(x - 12, H - GROUND + 14); ctx.fill();
  }
  ctx.fillStyle = "#b9863f"; ctx.fillRect(0, H - GROUND + 14, W, 4);
}

function drawBird() {
  ctx.save(); ctx.translate(BX, bird.y);
  ctx.rotate(mode === "over" ? 1.2 : clamp(bird.vy * 0.07, -.5, .8));
  ctx.fillStyle = "#00000022"; ctx.beginPath(); ctx.ellipse(2, 4, BR + 2, BR - 2, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(-4, -6, 2, 0, 0, BR + 4);
  g.addColorStop(0, "#fff08a"); g.addColorStop(1, "#f5a623");
  ctx.fillStyle = g; ctx.strokeStyle = "#7c4a03"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, BR + 3, BR, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff3c4"; ctx.beginPath(); ctx.ellipse(2, 6, 10, 6, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(-5, 2); ctx.rotate(Math.sin(bird.flap) * .6);
  ctx.fillStyle = "#f08a00"; ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, -.3, 0, 7); ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(8, -5, 6, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(10, -5, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(25, 3); ctx.lineTo(14, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawPip() {
  if (!useCam || video.readyState < 2) return;
  const w = 160, h = 120, x = W - w - 12, y = 12;
  ctx.save(); ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, 10) : ctx.rect(x, y, w, h); ctx.clip();
  ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, w, h); ctx.restore();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  if (noseN) { ctx.fillStyle = "#ef4444"; ctx.beginPath(); ctx.arc(x + (1 - noseN.x) * w, y + noseN.y * h, 5, 0, 7); ctx.fill(); }
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawSky();
  if (mode !== "menu") pipes.forEach(p => drawPipe(p.x, p.top));
  drawGround();
  if (mode !== "over" || shake > 0 || parts.length) drawBird();
  for (const p of parts) { ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (mode !== "menu") {
    ctx.font = `bold ${46 + pulse * 14}px system-ui`; ctx.textAlign = "center"; ctx.lineWidth = 6;
    ctx.strokeStyle = "#0008"; ctx.strokeText(score, W / 2, 62); ctx.fillStyle = "#fff"; ctx.fillText(score, W / 2, 62);
    ctx.font = "600 14px system-ui"; ctx.textAlign = "left"; ctx.lineWidth = 3;
    ctx.strokeText(`Terbaik: ${best}`, 16, 28); ctx.fillText(`Terbaik: ${best}`, 16, 28);
  }
  ctx.restore();
  drawPip();
}

function frame(t) {
  const dt = Math.min((t - last) / 16.67, 3); last = t;
  readPose(); update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
